[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-intel"
version = "0.1.0"
description = "Document Intelligence Tool - RAG System"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "AI Team", email = "team@example.com"}
]

dependencies = [
    "typer[all]>=0.12.0",
    "llama-index-core>=0.10.0",
    "llama-index-embeddings-ollama>=0.1.0",
    "llama-index-vector-stores-chroma>=0.1.0",
    "chromadb>=0.4.0",
    "openai>=1.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
docintel = "cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]  # root-level package

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
